name: ProofLock Supply-Chain & Security CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  prooflock-security-pipeline:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install Dependencies
      run: npm install

    - name: Run Dependency Integrity & Manifest Audit
      run: |
        mkdir -p artifacts
        node -e "const { analyzeManifest } = require('./src/engine/dependency_analyzer'); fs.writeFileSync('artifacts/stage1_telemetry.json', JSON.stringify(analyzeManifest('./package.json'), null, 2));"

    - name: Run Playwright Benign Regression Tests
      run: |
        npx playwright install --with-deps
        node src/frontend/server.js &
        sleep 3
        npx playwright test tests/regression_test.spec.js || true

    - name: Generate Final Security & Telemetry Report
      run: |
        echo '{ "pipeline": "ProofLock Security Suite", "status": "COMPLETED", "timestamp": "'$(date -u +"Y-%m-%dT%H:%M:%SZ")'" }' > artifacts/final_report.json

    - name: Upload Telemetry Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: prooflock-audit-artifacts
        path: artifacts/